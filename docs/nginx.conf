# Static Astro site. Runs behind the reverse proxy for docs.øl.cer06.no.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Keep redirects (e.g. /guide -> /guide/) relative, so they work behind the HTTPS proxy.
    absolute_redirect off;

    # Hashed build assets can be cached forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Pages change on every build (and admin pages when the password changes).
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
