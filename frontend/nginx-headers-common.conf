# Headers for every response, including the ones proxied from Django (which sets its own
# X-Frame-Options, X-Content-Type-Options and Referrer-Policy). Included per location: an
# add_header inside a location would otherwise drop the server-level ones.

# Private app: keep it out of search engines.
add_header X-Robots-Tag "noindex, nofollow" always;
# Only the camera is used (barcode scanning on the website).
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# Only HTTPS from now on (ignored when the page is opened over plain HTTP, e.g. on the LAN).
add_header Strict-Transport-Security "max-age=31536000" always;
# No cross-origin windows or embedding of our responses.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
