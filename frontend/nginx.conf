# Serves the React build and the photos, and proxies API/admin traffic to Django, so the browser
# sees a single origin (session cookie + CSRF just work).

# Docker's internal DNS. The backend is looked up per request (cached 10 s) instead of once at
# startup, so recreating the backend container on an update doesn't leave nginx pointing at
# its old IP (which shows up as 502 Bad Gateway).
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserve headers from an outer TLS-terminating proxy if there is one.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location ~ ^/(graphql|api|admin|static)/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/headers-common.conf;
    }

    # Photo uploads (the apps shrink photos first; this allows untouched camera files too).
    location ~ ^/api/drinks/\d+/photo/$ {
        client_max_body_size 16m;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        include /etc/nginx/snippets/headers-common.conf;
    }

    # Drink photos, straight from the media volume. File names are random and never reused, so
    # they can be cached forever. Cross-origin is allowed so the phone apps (https://localhost,
    # capacitor://localhost) can show them.
    location /media/ {
        alias /srv/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/headers-app.conf;
        try_files $uri =404;
    }

    # OCR engine and language data: big, change only with an update.
    location /ocr/ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/headers-app.conf;
        types {
            application/javascript js;
            application/wasm wasm;
            application/gzip gz;
        }
        try_files $uri =404;
    }

    # The web app manifest: nginx's own type list doesn't know .webmanifest.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers-app.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers-app.conf;
    }

    # Client-side routing: unknown paths get the SPA shell.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers-app.conf;
        try_files $uri /index.html;
    }
}
