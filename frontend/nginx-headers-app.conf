# Headers for the React app itself (index.html and its assets).
include /etc/nginx/snippets/headers-common.conf;

# Scripts only from this site (the build has no inline scripts); 'wasm-unsafe-eval' lets the
# OCR and barcode engines (WebAssembly, served from /ocr/) start. Mantine sets inline styles,
# hence 'unsafe-inline' for styles. Pictures in look-up results come from the drink databases
# over HTTPS; photos being cropped are blob: URLs.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob: mediastream:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
