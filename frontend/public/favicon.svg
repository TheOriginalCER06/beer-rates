<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">

  <!-- Beer glass -->
  <g transform="translate(8, 7.8) scale(0.5)">

    <!-- Beer inside -->
    <path d="M -7 -10 L -5 14 Q -5 14 5 14 L 7 -10 Z" fill="#f59e0b" opacity="0.3"/>

    <!-- Foam -->
    <circle cx="-5" cy="-10" r="3" fill="#fefece" opacity="0.7"/>
    <circle cx="0" cy="-11" r="3.5" fill="#fefece" opacity="0.7"/>
    <circle cx="5" cy="-10" r="3" fill="#fefece" opacity="0.7"/>

    <!-- Highlight -->
    <path d="M -5 -5 Q -4 5 -3 12" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.5"/>

    <!-- Glass body -->
    <path d="M -8 -10 L -6 12 Q -6 14 -4 14 L 4 14 Q 6 14 6 12 L 8 -10 Z" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>
